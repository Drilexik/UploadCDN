# Fail2ban filter for UploadCDN.
# Matches nginx access-log lines (log_format "main") where a client gets a
# 401 (bad admin password) or 429 (rate-limited / locked out) on an /api/
# endpoint — i.e. credential guessing or API hammering.
#
# Install: copy to /etc/fail2ban/filter.d/uploadcdn.conf
# (buildcdnapp can do this for you).

[Definition]

failregex = ^<HOST> -\s+\S+\s+\[[^\]]+\]\s+"(?:GET|POST|PUT|PATCH|DELETE)\s+/api/[^"]*\s+HTTP/[^"]+"\s+(?:401|429)\b

ignoreregex =

datepattern = \[%d/%b/%Y:%H:%M:%S
