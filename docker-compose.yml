# UploadCDN Docker Compose Security Configuration

services:
  uploadcdn:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uploadcdn
    restart: unless-stopped
    
    # Security: Read-only filesystem. Only /tmp and the Next.js runtime cache
    # are writable. NOTE: do NOT tmpfs the whole /app/.next — that masks the
    # standalone build (BUILD_ID, server chunks) and the server fails to start.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    
    # Security: Drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    environment:
      # Preferred: salted scrypt hash (set by buildcdnapp/redeploycdnweb).
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      # Legacy plaintext password (optional; used only if no hash is set).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - BASE_URL=${BASE_URL}
      - NODE_ENV=production
      - PORT=3000
      - UPLOADS_DIR=/app/uploads
    
    volumes:
      # Mount uploads directory (must exist with proper permissions)
      - ./uploads:/app/uploads:rw
    
    ports:
      # Only expose to localhost, use reverse proxy for external access
      - "127.0.0.1:3000:3000"
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Reverse proxy with SSL (nginx)
  nginx:
    image: nginx:alpine
    container_name: uploadcdn-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # Access/error logs written to a real file on the host so fail2ban
      # (see fail2ban/) can ban abusive IPs.
      - ./logs/nginx:/var/log/nginx

    # Wait until the app is actually healthy, otherwise nginx fails to resolve
    # the "uploadcdn" upstream at startup ("host not found in upstream").
    depends_on:
      uploadcdn:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
    driver: local
